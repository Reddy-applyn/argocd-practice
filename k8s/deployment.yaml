apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-practice

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx-practice

  template:
    metadata:
      labels:
        app: nginx-practice

    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80